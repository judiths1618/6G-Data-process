rules:
  # 1) Main index: scenario1.csv (paths, labels, additional info)
  - patterns:
      - "6GDALI_Datasets/DeepSense/Scenario33/scenario33\\.csv$"
      # - ".*scenario33/scenario33\\.csv$"
    metadata_path: "6GDALI_Datasets/DeepSense/Scenario33/scenario33_metadata.txt"
    metadata_targets:
      - scenario33.csv

    required_cols:
      - index
      - unit1_rgb
      - unit1_pwr_60ghz
      - unit1_lidar
      - unit1_radar
      - unit1_loc
      - unit2_loc
      - unit1_beam
      - unit1_max_pwr
      - time_stamp
      - seq_index
      - unit2_spd_over_grnd_kmph
      - unit2_num_sats
      - unit2_altitude
      - unit2_geo_sep
      - unit2_mode_fix_type
      - unit2_pdop
      - unit2_hdop
      - unit2_vdop
      - unit2_interpolated_position

    numeric_cols:
      - index
      - unit1_max_pwr
      - seq_index
      - unit2_spd_over_grnd_kmph
      - unit2_num_sats
      - unit2_altitude
      - unit2_geo_sep
      - unit2_pdop
      - unit2_hdop
      - unit2_vdop  
      - unit2_interpolated_position

    ranges:
      unit1_max_pwr: [0, 1]
      seq_index: [0, 24]
      index: [0, null]
      unit2_spd_over_grnd_kmph: [0, 1]
      unit2_num_sats: [0, null]
      unit2_pdop: [0.0, null]
      unit2_hdop: [0.0, null]
      unit2_vdop: [0.0, 1.0]
      unit2_interpolated_position: [0.0, 1.0]

    enums:
      {}

    # Scenario 1 time stamp is sub-second within session, not epoch
    event_time_col: "time_stamp"
    event_time_format: "deepsense_scen42"  # Normalize to ISO in the pipeline
    freshness_slo_hours: null
    max_future_hours: null
    time_epoch_bounds: null

    primary_key: index

  