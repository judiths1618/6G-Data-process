[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sixg-dataops"
version = "0.2.0"
description = "Minimal DataOps toolkit for 6G-DALI data cleaning, validation, and orchestration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.26",
    "great_expectations>=0.18,<1.0",
    "numpy>=1.23",
    "pandas>=2.1.1,<2.3",
    "pandera>=0.19",
    "pyarrow>=12.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
orchestration = [
    "apache-airflow>=2.9",
    "prefect>=2.20",
]
dvc = [
    "dvc>=3.50",
]

[project.scripts]
dataops = "dataops.cli:main"
data-process-modules = "data_process_modules.cli:main"
minimal-dataops = "pipelines.minimal_dataops:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["dataops*", "data_process_modules*", "pipelines*"]
exclude = ["dockers*", "experiments*", "generated*", "notebooks*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
