# Stage-based file naming — every artifact derives from the dataset <name>:
#   data/processed/<name>_soft_cleaned.csv   (conservative cleaning)
#   data/processed/<name>_remediated.csv     (= `output`; per-issue fixes)
#   data/processed/<name>_regularized/       (prepared bundle; gaps explicit)
#   data/processed/<name>_generated/         (imputed splits + *_final)
#   data/processed/<name>_final.csv          (gap-free; imputed train + test)
#   reports/<name>_report.json  ·  reports/<name>_imputation_compare.json
#
# Other datasets (swap the two paths, or override with --input/--output/--report):
#   data/raw/amf-performance.csv                 → data/processed/amf-performance_remediated.csv
#   data/raw/golang-web-server-performance.csv   → ..._remediated.csv
#   data/raw/python-web-server-performance.csv   → ..._remediated.csv
#   data/raw/user_0_sample_0_antenna_0.csv       → ..._remediated.csv  (tabular; no imputation)

input: data/raw/rabbitmq-performance.csv
output: data/processed/rabbitmq-performance_remediated.csv
soft_cleaned_output:                              # null → <name>_soft_cleaned.csv
cleaned_output:                                   # backward-compatible alias for soft_cleaned_output
report: reports/rabbitmq-performance_report.json
log_file: logs/rabbitmq-performance-dataops.log
timestamp_col:

validation:
  mode: auto
  expected_columns: []
  numeric_bounds: {}
  missing_threshold: 0.0
  require_timestamp_unique: true
  require_timestamp_monotonic: true
  allow_step_index_timestamp: false
  outlier_q: 0.01        # flag values outside the [q, 1-q] quantile band
  outlier_mostly: 0.95   # GX pass threshold for that band (margin over the ~2q tail)

# Imputation handoff: the pipeline regularizes gappy timelines and advertises a
# method catalog; it does NOT run imputation. Choose (app, method) here and the
# external orchestrator invokes the matching app on the prepared-dir bundle.
imputation:
  app:               # Darts | ImputeGAP | PyPOTS | WaveStitchPlus
  method:            # e.g. saits, iim, linear, v2
  build_bundle: true
  prepared_dir:      # default: <output_stem>_prepared/ next to the output csv
