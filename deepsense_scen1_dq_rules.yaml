rules:
  # 1) Main index: scenario1.csv (paths, labels, additional info)
  - patterns:
      - "6GDALI_Datasets/DeepSense/Scenario1/scenario1\\.csv$"
      # - ".*scenario1/scenario1\\.csv$"
    metadata_path: "6GDALI_Datasets/DeepSense/Scenario1/README.md"
    metadata_targets:
      - scenario1.csv

    required_cols:
      # Paths to modalities (as relative paths)
      - unit1_rgb
      - unit1_pwr_60ghz
      - unit1_loc
      - unit2_loc
      # if present (many scenarios use the calibrated path name)
      - unit2_loc_cal
      # Labels
      - unit1_beam_index
      - seq_index
      - unit2_direction
      # Additional information (Scenario 1 cols 8–16)
      - index
      - time_stamp[UTC]
      - unit2_num_sat
      - unit2_sat_used
      - unit2_fix_type
      - unit2_DGPS
      - unit2_PDOP
      - unit2_HDOP

    numeric_cols:
      - unit1_beam_index
      - seq_index
      - index
      - unit2_direction
      - unit2_num_sat
      - unit2_PDOP
      - unit2_HDOP

    ranges:
      unit1_beam_index: [1, 64]
      seq_index: [0, null]
      index: [0, null]
      unit2_direction: [0, 1]
      unit2_num_sat: [0, null]
      unit2_PDOP: [0.0, null]
      unit2_HDOP: [0.0, null]

    enums:
      unit2_fix_type: ["2D", "3D", "No Fix"]
      unit2_DGPS: ["Yes", "No"]

    # Scenario 1 time stamp is sub-second within session, not epoch
    event_time_col: "time_stamp[UTC]"
    event_time_format: "HH-mm-ss-SSS"   # e.g., '00-42-15-125'
    freshness_slo_hours: 87600           # static dataset; set large window
    max_future_hours: 1
    time_epoch_bounds: {min: 0, max: 4102444800}

    primary_key: index

